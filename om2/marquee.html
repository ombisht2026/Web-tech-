<h1><font face="Comic Sans MS">Marquee: Move Text, Image and Hyperlink</font></h1>

<!-- USE: marquee tag moves things. ATTRIBUTES: direction, behavior, scrollamount, bgcolor -->
<h3>Moving Text</h3>
<marquee direction="left" behavior="scroll" scrollamount="6" bgcolor="dark blue">HTML Tutorial</marquee>

<h3>Moving Image</h3>
<marquee direction="right" behavior="alternate" scrollamount="8">
<img src="download (1).png" width="80" height="80" alt="picture">
</marquee>

<h3>Moving Hyperlink</h3>
<marquee direction="up" height="60" scrollamount="3" bgcolor="lightblue">
<a href="index.html">Click me to go Home</a>
</marquee>

<p><a href="#top">Go to top of this page (internal link)</a></p>
</body>
</html>
