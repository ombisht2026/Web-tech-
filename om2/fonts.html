<h1><font face="Courier New">Font Styles and Image Tag</font></h1>

<h2>Font Tag</h2>
<!-- USE: font tag changes text look. ATTRIBUTES: face, size, color -->
<p><font face="Arial" size="4" color="red">This text uses Arial, size 4, red colour.</font></p>
<p><font face="Times New Roman" size="5" color="blue">This text uses Times New Roman, size 5, blue colour.</font></p>
<p><font face="Comic Sans MS" size="6" color="green">This text uses Comic Sans MS, size 6, green colour.</font></p>

<h2>Image Tag</h2>
<!-- USE: img tag shows a picture. ATTRIBUTES: src, width, height, alt, border -->
<img src="download.png" width="150" height="150" alt="My Picture" border="3">
